<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('My Profile', 'profile', ~{::content})}">
<th:block th:fragment="content">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="profile-card">
                <div class="mb-4">
                    <div class="d-inline-block p-4 rounded-circle bg-light border mb-3">
                        <i class="fas fa-user-circle fa-4x" style="color: var(--slate);"></i>
                    </div>
                    <h2 class="fw-bold">Welcome, <span th:text="${user.name}">User</span>!</h2>
                    <p class="text-muted" th:text="${user.email}">user@example.com</p>
                </div>

                <hr class="my-4 opacity-25">

                <div class="d-grid gap-3">
                    <a href="/UserInput.html" class="btn btn-primary-custom py-2" style="background-color: var(--cobalt); color: white; border-radius: 8px; text-decoration: none;">
                        <i class="fas fa-chart-line me-2"></i> Launch Forecast Engine
                    </a>

                    <a href="/edit" class="btn btn-outline-custom py-2 rounded-3">
                        <i class="fas fa-user-edit me-2"></i> Edit Profile Details
                    </a>
                </div>

                <div class="mt-5">
                    <a href="/deleteAccount" class="delete-link"
                       onclick="return confirm('CRITICAL: Are you sure you want to permanently delete your account? This action is irreversible.')">
                        <i class="fas fa-trash-alt me-1"></i> Deactivate Account
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</th:block>
</html>
