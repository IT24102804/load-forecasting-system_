<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - AI Load Forecasting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background:#F4F7F9; font-family: 'Inter', sans-serif;">
<div class="container text-center mt-5">
    <i class="fas fa-exclamation-triangle fa-4x mb-4" style="color:#0047AB;"></i>
    <h2 class="fw-bold mb-2">Something went wrong</h2>
    <p class="text-muted mb-4" th:text="${message} ?: 'An unexpected error occurred.'"></p>
    <a href="/" style="background:#0047AB; color:white; padding:10px 30px; border-radius:20px; text-decoration:none; font-weight:600;">
        Back to Login
    </a>
</div>
</body>
</html>
