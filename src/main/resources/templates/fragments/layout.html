<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:th-attr="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, activeNav, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' — AI Load Forecasting'">AI Load Forecasting</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Shared stylesheet — the ONLY place styles should live -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
    <div class="container-fluid px-4">
        <a class="navbar-brand" th:href="@{/home}">
            <i class="fas fa-bolt me-2" style="color: var(--light-blue);"></i> AI Load Forecasting
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">



                <li class="nav-item">
                    <a class="nav-link" th:href="@{/weather}"
                       th:classappend="${activeNav == 'weather'} ? 'active' : ''">
                        <i class="fas fa-cloud-sun me-1"></i> Weather
                    </a>
                </li>




                <li class="nav-item">
                    <a class="nav-link" th:href="@{/forecast/dashboard}"
                       th:classappend="${activeNav == 'forecast'} ? 'active' : ''">
                        <i class="fas fa-chart-line me-1"></i> Forecast
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/generation-mix}"
                       th:classappend="${activeNav == 'generationmix'} ? 'active' : ''">
                        <i class="fas fa-industry me-1"></i> Generation Mix
                    </a>
                </li>





                <!-- Move Anomalies inside the admin check -->
                <li class="nav-item"
                    th:if="${session.role == 'Admin' or session.role == 'Administrator'}">
                    <a class="nav-link" th:href="@{/anomaly}"
                       th:classappend="${activeNav == 'anomaly'} ? 'active' : ''">
                        <i class="fas fa-exclamation-triangle me-1"></i> Anomalies
                    </a>
                </li>





                <li class="nav-item">
                    <a class="nav-link" th:href="@{/feedback/home}"
                       th:classappend="${activeNav == 'feedback'} ? 'active' : ''">
                        <i class="fas fa-comments me-1"></i> Feedback
                    </a>
                </li>

                <!-- Admin-only link — only show if role is Admin -->
                <li class="nav-item" th:if="${session.role == 'Admin' or session.role == 'Administrator'}">
                    <a class="nav-link" th:href="@{/admin/index.html}"
                       th:classappend="${activeNav == 'admin'} ? 'active' : ''">
                        <i class="fas fa-shield-alt me-1"></i> Admin
                    </a>
                </li>

                <li class="nav-item ms-lg-2">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="fas fa-user-circle me-1"></i>
                        <span th:text="${session.userName != null ? session.userName : 'Profile'}">Profile</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a th:href="@{/logout}" class="btn btn-sm btn-light rounded-pill px-3 fw-bold ms-lg-2">
                        <i class="fas fa-sign-out-alt me-1"></i> Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===== FLASH MESSAGES (success/error from redirects) ===== -->
<div class="container-fluid px-4">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm" role="alert">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- ===== PAGE CONTENT ===== -->
<main class="container-fluid px-4 pb-5">
    <th:block th:replace="${content}"/>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
