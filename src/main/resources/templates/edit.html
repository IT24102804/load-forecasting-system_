<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Edit Profile', 'profile', ~{::content})}">
<th:block th:fragment="content">

  <!-- Center the form under the new navbar -->
  <div class="container d-flex justify-content-center mt-5">
<div style="width:100%; max-width:420px; padding:1rem;">
  <div class="text-center mb-4">
    <div class="mb-3 d-inline-block p-3 rounded-circle" style="background: rgba(0, 71, 171, 0.05);">
      <i class="fas fa-user-edit fa-2x" style="color: var(--cobalt);"></i>
    </div>
    <h3 class="fw-bold" style="color: var(--navy);">Edit Profile</h3>
    <p class="text-muted small">Update your account credentials</p>
  </div>

  <form action="/update" method="post" id="editForm" novalidate>

    <div class="mb-3">
      <label class="form-label small fw-bold" style="color: var(--navy);">Full Name</label>
      <div class="input-group">
        <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
        <input type="text" name="name" th:value="${user.name}" class="form-control border-start-0" required>
        <div class="invalid-feedback">Please enter your name.</div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label small fw-bold" style="color: var(--navy);">Email Address</label>
      <div class="input-group">
        <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
        <input type="email" name="email" th:value="${user.email}" class="form-control border-start-0" required>
        <div class="invalid-feedback">A valid email is required.</div>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label small fw-bold" style="color: var(--navy);">Update Password</label>
      <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
              <i class="fas fa-lock text-muted"></i>
          </span>
        <input type="password" name="password" id="editPasswordInput"
               th:value="${user.password}" class="form-control border-start-0 border-end-0"
               required minlength="6">
        <span class="input-group-text bg-light border-start-0"
              onclick="toggleEditPassword()" style="cursor:pointer;">
              <i class="fas fa-eye text-muted" id="editEyeIcon"></i>
          </span>
        <div class="invalid-feedback">Password must be at least 6 characters.</div>
      </div>
    </div>

    <button type="submit" class="btn btn-primary-custom w-100 rounded-pill mb-3">
      Save Changes <i class="fas fa-save ms-2"></i>
    </button>
  </form>

  <div class="text-center mt-2">
    <a href="/dashboard" class="small fw-bold text-muted" style="text-decoration: none;">
      <i class="fas fa-arrow-left me-1"></i> Cancel and return to Dashboard
    </a>
  </div>
</div>

<script>
  function toggleEditPassword() {
    const input = document.getElementById('editPasswordInput');
    const icon = document.getElementById('editEyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }

  // Client-side visual validation
  document.getElementById('editForm').addEventListener('submit', function(event) {
    if (!this.checkValidity()) {
      event.preventDefault();
      event.stopPropagation();
    }
    this.classList.add('was-validated');
  });
</script>

  </div>
</th:block>
</html>
