<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Feedback - AI Load Forecasting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .rating {
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-end;
    }
    .rating input {
      display: none;
    }
    .rating label {
      cursor: pointer;
      width: 40px;
      height: 40px;
      background: #ddd;
      margin: 0 2px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: 0.3s;
    }
    .rating input:checked ~ label,
    .rating label:hover,
    .rating label:hover ~ label {
      background: #ffc107;
      color: white;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="/feedback/home">
      <i class="fas fa-bolt me-2"></i>AI Load Forecasting
    </a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/feedback/submit">
        <i class="fas fa-comment"></i> Submit Feedback
      </a>
      <a class="nav-link" th:href="@{/feedback/my-feedback(email=${email})}">
        <i class="fas fa-history"></i> My Feedback
      </a>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header bg-warning text-white">
          <h4 class="mb-0"><i class="fas fa-edit me-2"></i>Edit Your Feedback</h4>
        </div>
        <div class="card-body">

          <div class="alert alert-info">
            <i class="fas fa-info-circle me-2"></i>
            You can edit this feedback until an admin replies.
          </div>

          <form th:action="@{/feedback/update}" th:object="${feedback}" method="post">

            <!-- Hidden fields -->
            <input type="hidden" name="id" th:value="*{id}">
            <input type="hidden" name="email" th:value="${email}">

            <!-- User Name -->
            <div class="mb-3">
              <label for="userName" class="form-label">Your Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="userName"
                     th:field="*{userName}" required>
            </div>

            <!-- Email (read-only) -->
            <div class="mb-3">
              <label for="userEmail" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="userEmail"
                     th:field="*{userEmail}" readonly disabled>
              <small class="text-muted">Email cannot be changed</small>
            </div>

            <!-- Feedback Type -->
            <div class="mb-3">
              <label for="feedbackType" class="form-label">Feedback Type <span class="text-danger">*</span></label>
              <select class="form-select" id="feedbackType" th:field="*{feedbackType}" required>
                <option th:each="type : ${feedbackTypes}"
                        th:value="${type}"
                        th:text="${type.toString().replace('_', ' ')}"
                        th:selected="${type == feedback.feedbackType}"></option>
              </select>
            </div>

            <!-- Rating -->
            <div class="mb-3">
              <label class="form-label d-block">Your Rating</label>
              <div class="rating">
                <input type="radio" name="rating" value="5" id="star5"
                       th:field="*{rating}" th:value="5">
                <label for="star5"><i class="fas fa-star"></i></label>

                <input type="radio" name="rating" value="4" id="star4"
                       th:field="*{rating}" th:value="4">
                <label for="star4"><i class="fas fa-star"></i></label>

                <input type="radio" name="rating" value="3" id="star3"
                       th:field="*{rating}" th:value="3">
                <label for="star3"><i class="fas fa-star"></i></label>

                <input type="radio" name="rating" value="2" id="star2"
                       th:field="*{rating}" th:value="2">
                <label for="star2"><i class="fas fa-star"></i></label>

                <input type="radio" name="rating" value="1" id="star1"
                       th:field="*{rating}" th:value="1">
                <label for="star1"><i class="fas fa-star"></i></label>
              </div>
            </div>

            <!-- Message -->
            <div class="mb-3">
              <label for="message" class="form-label">Your Feedback <span class="text-danger">*</span></label>
              <textarea class="form-control" id="message" rows="5"
                        th:field="*{message}" required></textarea>
            </div>

            <!-- Status (read-only) -->
            <div class="mb-3">
              <label class="form-label">Current Status</label>
              <div>
                <span class="badge bg-warning" th:text="*{status}">PENDING</span>
              </div>
            </div>

            <!-- Submit Buttons -->
            <div class="d-flex justify-content-between">
              <a th:href="@{/feedback/my-feedback(email=${email})}"
                 class="btn btn-secondary">
                <i class="fas fa-times me-1"></i>Cancel
              </a>
              <button type="submit" class="btn btn-warning">
                <i class="fas fa-save me-1"></i>Save Changes
              </button>
            </div>
          </form>
        </div>
        <div class="card-footer text-muted">
          <small><i class="fas fa-clock me-1"></i>Created:
            <span th:text="${#temporals.format(feedback.createdAt, 'MMM dd, yyyy HH:mm')}">date</span>
          </small>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
