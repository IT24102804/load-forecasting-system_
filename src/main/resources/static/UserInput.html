<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Load Forecast System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 500px; margin-top: 50px; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
        .anomaly-warning {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }
        .feedback-buttons { margin-top: 10px; display: none; }
        .btn-feedback { margin-right: 10px; }
        .loading { display: none; text-align: center; margin-top: 10px; }
        .debug-box { background-color: #e9ecef; padding: 10px; margin-top: 15px; font-size: 12px; border-radius: 5px; display: none; word-break: break-all; }
    </style>
</head>
<body>

<div class="container bg-white p-4 rounded shadow">
    <h3 class="text-center mb-4">Load Forecast System</h3>

    <div class="mb-3">
        <label for="ts" class="form-label">Target Timestamp</label>
        <input type="datetime-local" id="ts" class="form-control" required>
        <div class="form-text">Select the time you want to forecast for.</div>
    </div>

    <div class="mb-3">
        <label for="temp" class="form-label">Temperature (°C)</label>
        <input type="number" id="temp" class="form-control" placeholder="e.g. 28.5" step="0.1" required>
    </div>

    <div class="mb-3">
        <label for="hum" class="form-label">Humidity (%)</label>
        <input type="number" id="hum" class="form-control" placeholder="e.g. 75" step="0.1" required>
    </div>

    <div class="mb-3">
        <label for="event" class="form-label">Public Event</label>
        <select id="event" class="form-select">
            <option value="0">No (Normal Day)</option>
            <option value="1">Yes (Holiday/Event)</option>
        </select>
    </div>

    <button class="btn btn-primary w-100" onclick="getPrediction()">Predict Demand</button>

    <div id="loading" class="loading">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p>Processing prediction...</p>
    </div>

    <div id="resultContainer" class="result-box bg-light border text-center">
        <h4 class="mb-0">Predicted Load Demand:</h4>
        <span id="result" class="display-6 text-success fw-bold">--</span> <span class="h4">kW</span>
    </div>

    <div id="anomalyWarning" class="anomaly-warning">
        <div class="d-flex align-items-center">
            <span style="font-size: 24px; margin-right: 10px;">⚠️</span>
            <div>
                <strong>Unusual Load Detected!</strong><br>
                This predicted load deviates significantly from normal patterns.
                Please verify if this prediction is plausible.
            </div>
        </div>
        <div id="feedbackButtons" class="feedback-buttons">
            <button class="btn btn-success btn-feedback" onclick="giveFeedback(true)">👍 Yes, this was helpful</button>
            <button class="btn btn-danger btn-feedback" onclick="giveFeedback(false)">👎 No, this was wrong</button>
        </div>
        <div id="feedbackConfirm" class="text-muted small mt-2" style="display: none;">
            Thank you for your feedback!
        </div>
    </div>

    <div id="errorBox" class="alert alert-danger mt-3" style="display: none;"></div>
    <div id="debugBox" class="debug-box" style="display: none;"></div>
</div>

<script>
    let currentPredictionId = null;

    // Helper: get season number from month (0=Spring, 1=Summer, 2=Fall, 3=Winter)
    function getSeason(month) {
        // month is 1-12
        if (month >= 3 && month <= 5) return 0;   // Spring
        if (month >= 6 && month <= 8) return 1;   // Summer
        if (month >= 9 && month <= 11) return 2;  // Fall
        return 3;                                 // Winter
    }

    async function getPrediction() {
        // Reset UI
        document.getElementById('resultContainer').style.display = 'none';
        document.getElementById('anomalyWarning').style.display = 'none';
        document.getElementById('errorBox').style.display = 'none';
        document.getElementById('debugBox').style.display = 'none';
        document.getElementById('feedbackButtons').style.display = 'none';
        document.getElementById('feedbackConfirm').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        const timestamp = document.getElementById('ts').value;
        const temperature = parseFloat(document.getElementById('temp').value);
        const humidity = parseFloat(document.getElementById('hum').value);
        const publicEvent = parseInt(document.getElementById('event').value);

        // Validate inputs
        if (!timestamp) {
            showError("Please select a timestamp.");
            return;
        }
        if (isNaN(temperature) || isNaN(humidity)) {
            showError("Please enter valid temperature and humidity values.");
            return;
        }

        const payload = {
            timestamp: timestamp,
            temperature: temperature,
            humidity: humidity,
            public_event: publicEvent
        };

        try {
            // 1. Call Spring Boot for prediction
            const response = await fetch('http://localhost:8080/api/forecast', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok) {
                showError(data.message || "Failed to get prediction.");
                return;
            }

            // Show prediction
            document.getElementById('result').innerText = data.load_demand.toFixed(2);
            document.getElementById('resultContainer').style.display = 'block';
            currentPredictionId = data.id;

            // 2. Prepare features for anomaly detection
            const tsDate = new Date(timestamp);
            const hour = tsDate.getHours();
            const day = tsDate.getDay() + 1;          // Monday=1, Sunday=7
            const month = tsDate.getMonth() + 1;
            const season = getSeason(month);

            const anomalyPayload = {
                load: data.load_demand,
                temp: temperature,
                humidity: humidity,
                hour: hour,
                day: day,
                month: month,
                event: publicEvent,
                season: season
            };

            // Show debug info (optional)
            const debugBox = document.getElementById('debugBox');
            debugBox.innerHTML = `<strong>Calling Flask with:</strong><br>${JSON.stringify(anomalyPayload, null, 2)}`;
            debugBox.style.display = 'block';

            // 3. Call Flask for anomaly detection
            const anomalyResponse = await fetch('http://localhost:5000/detect_anomaly', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(anomalyPayload)
            });

            const anomalyData = await anomalyResponse.json();
            debugBox.innerHTML += `<br><br><strong>Flask response:</strong><br>${JSON.stringify(anomalyData, null, 2)}`;

            if (anomalyData.is_anomaly) {
                document.getElementById('anomalyWarning').style.display = 'block';
                document.getElementById('feedbackButtons').style.display = 'block';
            }

        } catch (error) {
            console.error(error);
            showError("Connection error. Ensure Java (port 8080) and Flask (port 5000) are running.");
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    async function giveFeedback(agreed) {
        try {
            const response = await fetch('http://localhost:8080/api/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    prediction_id: currentPredictionId,
                    user_agreed: agreed
                })
            });

            if (response.ok) {
                document.getElementById('feedbackButtons').style.display = 'none';
                document.getElementById('feedbackConfirm').style.display = 'block';
            } else {
                console.error("Feedback failed:", await response.text());
            }
        } catch (error) {
            console.error("Feedback error:", error);
        }
    }

    function showError(msg) {
        const errorBox = document.getElementById('errorBox');
        errorBox.innerText = msg;
        errorBox.style.display = 'block';
        document.getElementById('loading').style.display = 'none';
    }
</script>
</body>
</html>
