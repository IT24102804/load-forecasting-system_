<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Feedback - AI Load Forecasting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="/css/main.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

</head>
<body>

<div class="d-flex">
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-shield-alt me-2" style="color: var(--light-blue);"></i> Admin Portal
        </div>

        <div class="mt-3 flex-grow-1">
            <a href="index.html"><i class="fas fa-tachometer-alt me-3 text-center" style="width: 20px;"></i> Dashboard</a>
            <a href="users.html"><i class="fas fa-users me-3 text-center" style="width: 20px;"></i> User Management</a>
            <a href="monitoring.html"><i class="fas fa-chart-line me-3 text-center" style="width: 20px;"></i> Model Monitoring</a>
            <a href="feedback.html" class="active"><i class="fas fa-comments me-3 text-center" style="width: 20px;"></i> Feedback Reply</a>
        </div>

        <div class="mb-3 border-top" style="border-color: rgba(255,255,255,0.1) !important;">
            <a href="/public-site"><i class="fas fa-external-link-alt me-3 text-center" style="width: 20px;"></i> View Public Site</a>
            <a href="#"><i class="fas fa-sign-out-alt me-3 text-center" style="width: 20px; color: #ff6b6b;"></i> Logout</a>
        </div>
    </div>

    <div class="main-content w-100">
        <div class="top-navbar">
            <h5 class="mb-0 fw-bold" style="color: var(--navy);">Feedback Management</h5>
            <div class="d-flex align-items-center">
                <span class="text-muted fw-semibold me-3">Welcome, Administrator</span>
                <div class="rounded-circle bg-light d-flex align-items-center justify-content-center border" style="width: 40px; height: 40px; color: var(--cobalt);">
                    <i class="fas fa-user-tie"></i>
                </div>
            </div>
        </div>

        <div class="container-fluid py-4 px-4" style="max-width: 900px; margin: 0 auto;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0" style="color: var(--navy);"><i class="fas fa-inbox me-2" style="color: var(--cobalt);"></i>User Feedback Queue</h4>
                <button class="btn btn-outline-secondary btn-sm" onclick="loadFeedbacks()">
                    <i class="fas fa-sync-alt me-1"></i> Refresh
                </button>
            </div>

            <div id="feedbackContainer">
                <div class="text-center py-5 ui-card">
                    <div class="spinner-border" style="color: var(--cobalt);" role="status"></div>
                    <p class="mt-3 text-muted fw-bold">Connecting to database...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="replyModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header text-white" style="background-color: var(--navy);">
                <h5 class="modal-title fw-bold"><i class="fas fa-reply me-2"></i>Respond to User</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <input type="hidden" id="replyFeedbackId"/>

                <div class="mb-4 p-3 rounded bg-light border-start border-4" style="border-color: var(--slate) !important;">
                    <small class="text-uppercase fw-bold text-muted d-block mb-1" style="font-size: 0.75rem;">Original Feedback</small>
                    <p id="replyOriginalMessage" class="mb-0 text-dark font-italic"></p>
                </div>

                <div class="form-group">
                    <label class="form-label fw-bold" style="color: var(--navy);">Official Admin Reply <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="replyText" rows="4" placeholder="Draft your response here to resolve this ticket..."></textarea>
                    <div id="replyError" class="invalid-feedback fw-semibold">
                        <i class="fas fa-exclamation-circle me-1"></i> Response cannot be empty.
                    </div>
                </div>
            </div>
            <div class="modal-footer bg-light">
                <button class="btn btn-outline-secondary fw-bold" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary-custom px-4" onclick="submitReply(this)">
                    <i class="fas fa-paper-plane me-2"></i> Submit & Resolve
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Create an instance of the modal for better programmatic control
    let replyModalInstance;
    const feedbackContainer = document.getElementById("feedbackContainer");

    document.addEventListener("DOMContentLoaded", function() {
        replyModalInstance = new bootstrap.Modal(document.getElementById('replyModal'));

        // Remove error styling when user starts typing
        document.getElementById('replyText').addEventListener('input', function() {
            this.classList.remove('is-invalid');
        });

        loadFeedbacks();
    });

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    async function parseApiResponse(response) {
        const contentType = (response.headers.get("content-type") || "").toLowerCase();
        if (contentType.includes("application/json")) {
            return { data: await response.json(), isJson: true };
        }
        return { data: await response.text(), isJson: false };
    }

    function describeResponseError(response, payload, isJson, action) {
        if (isJson && payload && typeof payload === "object" && payload.error) {
            return payload.error;
        }
        if (response.status === 403) {
            return "Admin session expired. Please sign in again.";
        }
        if (response.status === 400) {
            return action === "reply"
                ? "Could not save the admin reply. Please review the input and try again."
                : "Could not load admin feedback because the request was rejected.";
        }
        if (response.status >= 500) {
            return action === "reply"
                ? "Server error while saving the admin reply."
                : "Server error while loading the admin feedback queue.";
        }
        return action === "reply"
            ? "Could not save the admin reply."
            : "Could not load the admin feedback queue.";
    }

    function renderFeedbackError(message) {
        feedbackContainer.innerHTML =
            '<div class="alert alert-danger shadow-sm border-0">' +
            '<i class="fas fa-exclamation-triangle me-2"></i>' +
            escapeHtml(message) +
            '</div>';
    }

    async function loadFeedbacks() {
        feedbackContainer.innerHTML =
            '<div class="text-center py-5 ui-card">' +
            '<div class="spinner-border" style="color: var(--cobalt);" role="status"></div>' +
            '<p class="mt-3 text-muted fw-bold">Loading feedback queue...</p>' +
            '</div>';

        try {
            const response = await fetch("/api/admin/feedback", {
                headers: { "Accept": "application/json" }
            });
            const { data, isJson } = await parseApiResponse(response);

            if (!response.ok) {
                throw new Error(describeResponseError(response, data, isJson, "load"));
            }
            if (!Array.isArray(data)) {
                throw new Error("Unexpected response received from the admin feedback API.");
            }

            feedbackContainer.innerHTML = "";

            if (data.length === 0) {
                feedbackContainer.innerHTML = '<div class="text-center py-5 ui-card"><i class="fas fa-check-circle fa-3x mb-3" style="color: #28a745;"></i><h5 class="text-muted">No pending feedback in the queue!</h5></div>';
                return;
            }

            data.forEach(function(fb) {
                var safeUserName = escapeHtml(fb.userName || "Anonymous User");
                var safeUserEmail = escapeHtml(fb.userEmail || "No email provided");
                var safeMessage = escapeHtml(fb.message || "");
                var safeAdminReply = escapeHtml(fb.adminReply || "");

                var statusBadge = fb.status === "RESOLVED"
                    ? '<span class="badge bg-success px-2 py-1 rounded-pill"><i class="fas fa-check me-1"></i>Resolved</span>'
                    : '<span class="badge bg-warning text-dark px-2 py-1 rounded-pill"><i class="fas fa-clock me-1"></i>Pending</span>';

                var replySection = "";
                if (fb.adminReply) {
                    replySection =
                        '<div class="mt-3 p-3 rounded" style="background-color: rgba(0, 71, 171, 0.05); border-left: 3px solid var(--cobalt);">' +
                        '<small class="text-uppercase fw-bold d-block mb-1" style="color: var(--cobalt); font-size: 0.75rem;"><i class="fas fa-user-shield me-1"></i>Administrator Response</small>' +
                        '<p class="mb-0 text-dark">' + safeAdminReply + '</p>' +
                        '</div>';
                }

                var replyButton = fb.status === "RESOLVED"
                    ? '<button class="btn btn-outline-secondary btn-sm mt-3 px-3 fw-bold rounded-pill" disabled><i class="fas fa-lock me-1"></i> Resolved</button>'
                    : '<button class="btn btn-primary-custom btn-sm mt-3 px-3 rounded-pill" data-id="' + fb.id + '" data-message="' + encodeURIComponent(fb.message || "") + '" onclick="openReplyModalFromButton(this)"><i class="fas fa-reply me-1"></i> Draft Reply</button>';

                var card = document.createElement("div");
                card.className = "card ui-card mb-4 border-0";
                card.innerHTML =
                    '<div class="card-body p-4">' +
                    '<div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">' +
                    '<div>' +
                    '<i class="fas fa-user-circle fs-4 me-2 align-middle text-muted"></i>' +
                    '<strong class="align-middle" style="color: var(--navy);">' + safeUserName + '</strong>' +
                    '<span class="text-muted ms-2 me-3 small">(' + safeUserEmail + ')</span>' +
                    statusBadge +
                    '</div>' +
                    '<span class="text-muted small fw-bold"><i class="fas fa-ticket-alt me-1"></i>Ticket #' + fb.id + '</span>' +
                    '</div>' +
                    '<p class="fs-6 mb-2" style="color: #333;">"' + safeMessage + '"</p>' +
                    replySection +
                    '<div class="text-end">' + replyButton + '</div>' +
                    '</div>';

                feedbackContainer.appendChild(card);
            });
        } catch (error) {
            if (error instanceof TypeError) {
                renderFeedbackError("Could not reach the admin feedback API. Ensure the Spring Boot server is running.");
                return;
            }
            renderFeedbackError(error.message || "Could not load the admin feedback queue.");
        }
    }

    function openReplyModal(id, message) {
        document.getElementById("replyFeedbackId").value = id;
        document.getElementById("replyOriginalMessage").innerText = '"' + message + '"';

        var replyInput = document.getElementById("replyText");
        replyInput.value = "";
        replyInput.classList.remove('is-invalid'); // Clear any old errors

        replyModalInstance.show();
    }

    function openReplyModalFromButton(button) {
        openReplyModal(button.dataset.id, decodeURIComponent(button.dataset.message || ""));
    }

    async function submitReply(button) {
        var id = document.getElementById("replyFeedbackId").value;
        var replyInput = document.getElementById("replyText");
        var replyText = replyInput.value.trim();

        // Native UI Validation instead of standard alert()
        if (replyText === "") {
            replyInput.classList.add('is-invalid');
            replyInput.focus();
            return;
        }

        var feedbackData = {
            adminReply: replyText
        };

        // Temporary Loading State on Button
        var originalBtnHtml = button.innerHTML;
        button.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Sending...';
        button.disabled = true;

        try {
            const response = await fetch("/api/admin/feedback/" + id, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(feedbackData)
            });
            const { data, isJson } = await parseApiResponse(response);

            if (!response.ok) {
                throw new Error(describeResponseError(response, data, isJson, "reply"));
            }

            replyModalInstance.hide();
            loadFeedbacks();
        } catch (error) {
            if (error instanceof TypeError) {
                renderFeedbackError("Could not reach the admin feedback API. Ensure the Spring Boot server is running.");
            } else {
                renderFeedbackError(error.message || "Could not save the admin reply.");
            }
        } finally {
            button.innerHTML = originalBtnHtml;
            button.disabled = false;
        }
    }
</script>
</body>
</html>
