<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Feedback Reply</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="style.css" rel="stylesheet"/>
</head>
<body>

<div class="d-flex">
    <div class="sidebar">
        <h4 class="text-center py-4 text-white fw-bold">⚡ Admin Panel</h4>
        <hr class="text-white"/>
        <a href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="users.html"><i class="bi bi-people"></i> User Management</a>
        <a href="monitoring.html"><i class="bi bi-graph-up"></i> Model Monitoring</a>
        <a href="feedback.html" class="active"><i class="bi bi-chat-left-text"></i> Feedback Reply</a>
        <hr class="text-white"/>
        <a href="#"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </div>

    <div class="main-content w-100">
        <nav class="navbar navbar-light bg-white shadow-sm px-4">
            <span class="navbar-brand fw-bold">Feedback Reply</span>
            <span class="text-muted">Welcome, Admin 👋</span>
        </nav>

        <div class="container-fluid py-4 px-4">
            <h5 class="fw-bold mb-3">User Feedbacks</h5>
            <div id="feedbackContainer">
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Loading feedbacks...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- REPLY MODAL -->
<div class="modal fade" id="replyModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Reply to Feedback</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="replyFeedbackId"/>
                <p id="replyOriginalMessage" class="text-muted border-start ps-3 mb-3"></p>
                <label class="form-label fw-bold">Your Reply</label>
                <textarea class="form-control" id="replyText" rows="3" placeholder="Type your reply here..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-success" onclick="submitReply()">
                    <i class="bi bi-send"></i> Send Reply
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function loadFeedbacks() {
        // 1. Updated URL to match your new Admin Controller
        fetch("/api/admin/feedback")
            .then(function(res) { return res.json(); })
            .then(function(feedbacks) {
                var container = document.getElementById("feedbackContainer");
                container.innerHTML = "";

                if (feedbacks.length === 0) {
                    container.innerHTML = "<p class='text-muted'>No feedbacks found.</p>";
                    return;
                }

                feedbacks.forEach(function(fb) {
                    // 2. Updated status check to match your Enum (RESOLVED)
                    var statusBadge = fb.status === "RESOLVED"
                        ? '<span class="badge bg-success ms-2">Resolved</span>'
                        : '<span class="badge bg-warning text-dark ms-2">Pending</span>';

                    var replySection = "";
                    // 3. Updated from fb.reply to fb.adminReply
                    if (fb.adminReply) {
                        replySection = '<div class="alert alert-success py-2 mt-2">' +
                            '<strong>Admin Reply:</strong> ' + fb.adminReply + '</div>';
                    }

                    var replyButton = fb.status === "RESOLVED"
                        ? '<button class="btn btn-secondary btn-sm mt-2" disabled><i class="bi bi-check"></i> Replied</button>'
                        : '<button class="btn btn-primary btn-sm mt-2" onclick="openReplyModal(' + fb.id + ', \'' + fb.message + '\')">' +
                        '<i class="bi bi-reply"></i> Reply</button>';

                    var card = document.createElement("div");
                    card.className = "card shadow-sm border-0 mb-3";
                    card.innerHTML =
                        '<div class="card-body">' +
                        '<div class="d-flex justify-content-between align-items-center mb-2">' +
                        '<div>' +
                        // 4. Updated from fb.username and fb.email to your variables
                        '<strong>' + (fb.userName || 'Anonymous') + '</strong>' +
                        '<span class="text-muted ms-2" style="font-size:13px;">' + fb.userEmail + '</span>' +
                        statusBadge +
                        '</div>' +
                        '<small class="text-muted">ID: ' + fb.id + '</small>' +
                        '</div>' +
                        '<p class="mb-2">' + fb.message + '</p>' +
                        replySection +
                        replyButton +
                        '</div>';

                    container.appendChild(card);
                });
            })
            .catch(function() {
                document.getElementById("feedbackContainer").innerHTML =
                    '<div class="alert alert-danger">Backend not connected. Please run the Spring Boot server.</div>';
            });
    }

    function openReplyModal(id, message) {
        document.getElementById("replyFeedbackId").value = id;
        document.getElementById("replyOriginalMessage").innerText = message;
        document.getElementById("replyText").value = "";
        new bootstrap.Modal(document.getElementById("replyModal")).show();
    }

    function submitReply() {
        var id = document.getElementById("replyFeedbackId").value;
        var replyText = document.getElementById("replyText").value.trim();

        if (replyText === "") {
            alert("Please type a reply first!");
            return;
        }

        // 5. Updated payload to use adminReply
        var feedbackData = {
            adminReply: replyText
        };

        // 6. Updated URL
        fetch("/api/admin/feedback/" + id, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(feedbackData)
        })
            .then(function(res) {
                if(!res.ok) throw new Error("Server error");
                return res.json();
            })
            .then(function() {
                alert("Reply sent successfully!");
                bootstrap.Modal.getInstance(document.getElementById("replyModal")).hide();
                loadFeedbacks(); // Refresh the list
            })
            .catch(function(err) {
                alert("Error sending reply. Make sure backend is running!");
                console.error(err);
            });
    }

    window.onload = function() {
        loadFeedbacks();
    };
</script>
</body>
</html>
