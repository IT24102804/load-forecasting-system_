<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="style.css" rel="stylesheet"/>
</head>
<body>

<div class="d-flex">
    <div class="sidebar">
        <h4 class="text-center py-4 text-white fw-bold">⚡ Admin Panel</h4>
        <hr class="text-white"/>
        <a href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="users.html" class="active"><i class="bi bi-people"></i> User Management</a>
        <a href="monitoring.html"><i class="bi bi-graph-up"></i> Model Monitoring</a>
        <a href="feedback.html"><i class="bi bi-chat-left-text"></i> Feedback Reply</a>
        <hr class="text-white"/>
        <a href="#"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </div>

    <div class="main-content w-100">
        <nav class="navbar navbar-light bg-white shadow-sm px-4">
            <span class="navbar-brand fw-bold">User Management</span>
            <span class="text-muted">Welcome, Admin 👋</span>
        </nav>

        <div class="container-fluid py-4 px-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold">All Users</h5>
                <button class="btn btn-primary" onclick="openAddModal()">
                    <i class="bi bi-person-plus"></i> Add New User
                </button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody id="userTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add New User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editIndex" value="-1"/>
                <input type="hidden" id="editUserId" value=""/>
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="userName" placeholder="Enter full name"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="userEmail" placeholder="Enter email"/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select class="form-select" id="userRole">
                        <option value="Admin">Admin</option>
                        <option value="Operator">Operator</option>
                        <option value="User">User</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" id="userStatus">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="saveUser()">Save User</button>
            </div>
        </div>
    </div>
</div>

<!-- DELETE MODAL -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">Are you sure you want to delete this user?</div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-danger" onclick="deleteRow()">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

    var rowToDelete = null;
    var deleteUserId = null;

    function loadUsers() {
        fetch("/api/users")
            .then(function(res) { return res.json(); })
            .then(function(users) {
                var tbody = document.getElementById("userTableBody");
                tbody.innerHTML = "";
                users.forEach(function(user, i) {
                    var roleBadge = user.role === "Admin"
                        ? '<span class="badge bg-danger">Admin</span>'
                        : user.role === "Operator"
                            ? '<span class="badge bg-primary">Operator</span>'
                            : '<span class="badge bg-info text-dark">User</span>';

                    var statusBadge = user.status === "Active"
                        ? '<span class="badge bg-success">Active</span>'
                        : '<span class="badge bg-secondary">Inactive</span>';

                    var row = tbody.insertRow();
                    row.setAttribute("data-id", user.id);
                    row.innerHTML =
                        "<td>" + (i + 1) + "</td>" +
                        "<td>" + user.name + "</td>" +
                        "<td>" + user.email + "</td>" +
                        "<td>" + roleBadge + "</td>" +
                        "<td>" + statusBadge + "</td>" +
                        "<td>" +
                        "<button class='btn btn-sm btn-warning me-1' onclick='openEditModal(" + i + ")'><i class='bi bi-pencil'></i> Edit</button>" +
                        "<button class='btn btn-sm btn-danger' onclick='openDeleteModal(" + i + "," + user.id + ")'><i class='bi bi-trash'></i> Delete</button>" +
                        "</td>";
                });
            })
            .catch(function() {
                document.getElementById("userTableBody").innerHTML =
                    "<tr><td colspan='6' class='text-center text-danger'>Backend not connected. Showing sample data.</td></tr>";
            });
    }

    function openAddModal() {
        document.getElementById("modalTitle").innerText = "Add New User";
        document.getElementById("editIndex").value = -1;
        document.getElementById("editUserId").value = "";
        document.getElementById("userName").value = "";
        document.getElementById("userEmail").value = "";
        document.getElementById("userRole").value = "User";
        document.getElementById("userStatus").value = "Active";
        new bootstrap.Modal(document.getElementById("userModal")).show();
    }

    function openEditModal(i) {
        var rows = document.getElementById("userTableBody").getElementsByTagName("tr");
        var cells = rows[i].getElementsByTagName("td");
        var userId = rows[i].getAttribute("data-id");

        document.getElementById("modalTitle").innerText = "Edit User";
        document.getElementById("editIndex").value = i;
        document.getElementById("editUserId").value = userId;
        document.getElementById("userName").value = cells[1].innerText;
        document.getElementById("userEmail").value = cells[2].innerText;
        document.getElementById("userRole").value = cells[3].innerText.trim();
        document.getElementById("userStatus").value = cells[4].innerText.trim();

        new bootstrap.Modal(document.getElementById("userModal")).show();
    }

    function saveUser() {
        var name = document.getElementById("userName").value;
        var email = document.getElementById("userEmail").value;
        var role = document.getElementById("userRole").value;
        var status = document.getElementById("userStatus").value;
        var index = parseInt(document.getElementById("editIndex").value);
        var userId = document.getElementById("editUserId").value;

        if (name === "" || email === "") {
            alert("Please fill in all fields!");
            return;
        }

        var userData = { name: name, email: email, role: role, status: status };

        if (index !== -1 && userId !== "") {
            fetch("/api/users/" + userId, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(userData)
            })
                .then(function(res) { return res.json(); })
                .then(function() {
                    alert("User updated successfully!");
                    loadUsers();
                })
                .catch(function() { alert("Error updating user!"); });
        } else {
            fetch("/api/users", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(userData)
            })
                .then(function(res) { return res.json(); })
                .then(function() {
                    alert("User added successfully!");
                    loadUsers();
                })
                .catch(function() { alert("Error adding user!"); });
        }

        bootstrap.Modal.getInstance(document.getElementById("userModal")).hide();
    }

    function openDeleteModal(i, userId) {
        rowToDelete = i;
        deleteUserId = userId;
        new bootstrap.Modal(document.getElementById("deleteModal")).show();
    }

    function deleteRow() {
        fetch("/api/users/" + deleteUserId, {
            method: "DELETE"
        })
            .then(function() {
                alert("User deleted!");
                loadUsers();
            })
            .catch(function() { alert("Error deleting user!"); });

        bootstrap.Modal.getInstance(document.getElementById("deleteModal")).hide();
    }

    window.onload = function() {
        loadUsers();
    };

</script>
</body>
</html>
