<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Dashboard - AI Load Forecasting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

<div class="d-flex">
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-shield-alt me-2" style="color: var(--light-blue);"></i> Admin Portal
        </div>

        <div class="mt-3 flex-grow-1">
            <a href="index.html" class="active"><i class="fas fa-tachometer-alt me-3 text-center" style="width: 20px;"></i> Dashboard</a>
            <a href="users.html"><i class="fas fa-users me-3 text-center" style="width: 20px;"></i> User Management</a>
            <a href="monitoring.html"><i class="fas fa-chart-line me-3 text-center" style="width: 20px;"></i> Model Monitoring</a>
            <a href="feedback.html"><i class="fas fa-comments me-3 text-center" style="width: 20px;"></i> Feedback Reply</a>
        </div>

        <div class="mb-3 border-top" style="border-color: rgba(255,255,255,0.1) !important;">
            <a href="/public-site"><i class="fas fa-external-link-alt me-3 text-center" style="width: 20px;"></i> View Public Site</a>
            <a href="#"><i class="fas fa-sign-out-alt me-3 text-center" style="width: 20px; color: #ff6b6b;"></i> Logout</a>
        </div>
    </div>

    <div class="main-content w-100">

        <div class="top-navbar">
            <h5 class="mb-0 fw-bold" style="color: var(--navy);">System Overview</h5>
            <div class="d-flex align-items-center">
                <span class="text-muted fw-semibold me-3">Welcome, Administrator</span>
                <div class="rounded-circle bg-light d-flex align-items-center justify-content-center border" style="width: 40px; height: 40px; color: var(--cobalt);">
                    <i class="fas fa-user-tie"></i>
                </div>
            </div>
        </div>

        <div class="container-fluid py-4 px-4">
            <div class="row g-4">

                <div class="col-md-4">
                    <div class="card metric-card bg-navy-grad">
                        <div class="card-body">
                            <h6 class="text-uppercase fw-bold opacity-75 mb-1" style="letter-spacing: 1px; font-size: 0.8rem;">Total Users</h6>
                            <h2 class="display-5 fw-bold mb-0">24</h2>
                            <i class="fas fa-users icon-bg"></i>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card metric-card bg-cobalt-grad">
                        <div class="card-body">
                            <h6 class="text-uppercase fw-bold opacity-75 mb-1" style="letter-spacing: 1px; font-size: 0.8rem;">Model Accuracy</h6>
                            <h2 class="display-5 fw-bold mb-0">94.5%</h2>
                            <i class="fas fa-chart-line icon-bg"></i>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card metric-card bg-warning-grad">
                        <div class="card-body">
                            <h6 class="text-uppercase fw-bold opacity-75 mb-1" style="letter-spacing: 1px; font-size: 0.8rem;">Pending Feedbacks</h6>
                            <h2 class="display-5 fw-bold mb-0">7</h2>
                            <i class="fas fa-comments icon-bg text-dark"></i>
                        </div>
                    </div>
                </div>

            </div>

            <div class="card border-0 shadow-sm mt-5" style="border-radius: 12px;">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4" style="color: var(--navy);">Quick Actions</h5>
                    <div class="d-flex gap-3 flex-wrap">
                        <a href="users.html" class="btn btn-outline-custom px-4 py-2">
                            <i class="fas fa-users-cog me-2"></i> Manage Users
                        </a>
                        <a href="monitoring.html" class="btn btn-outline-custom px-4 py-2">
                            <i class="fas fa-server me-2"></i> View Model Stats
                        </a>
                        <a href="feedback.html" class="btn btn-primary-custom px-4 py-2">
                            <i class="fas fa-reply me-2"></i> Review Pending Feedback
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
