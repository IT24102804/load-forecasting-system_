<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="style.css" rel="stylesheet"/>
</head>
<body>

<!-- SIDEBAR -->
<div class="d-flex">
    <div class="sidebar">
        <h4 class="text-center py-4 text-white fw-bold">⚡ Admin Panel</h4>
        <hr class="text-white"/>
        <a href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="users.html"><i class="bi bi-people"></i> User Management</a>
        <a href="monitoring.html"><i class="bi bi-graph-up"></i> Model Monitoring</a>
        <a href="feedback.html"><i class="bi bi-chat-left-text"></i> Feedback Reply</a>
        <hr class="text-white"/>
        <a href="#"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content w-100">

        <!-- TOP NAVBAR -->
        <nav class="navbar navbar-light bg-white shadow-sm px-4">
            <span class="navbar-brand fw-bold">Dashboard</span>
            <span class="text-muted">Welcome, Admin 👋</span>
        </nav>

        <!-- DASHBOARD CARDS -->
        <div class="container-fluid py-4 px-4">
            <div class="row g-4">

                <div class="col-md-4">
                    <div class="card shadow-sm border-0 text-white bg-primary">
                        <div class="card-body">
                            <h6>Total Users</h6>
                            <h2>24</h2>
                            <i class="bi bi-people fs-1 float-end"></i>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card shadow-sm border-0 text-white bg-success">
                        <div class="card-body">
                            <h6>Model Accuracy</h6>
                            <h2>94.5%</h2>
                            <i class="bi bi-graph-up fs-1 float-end"></i>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card shadow-sm border-0 text-white bg-warning">
                        <div class="card-body">
                            <h6>Pending Feedbacks</h6>
                            <h2>7</h2>
                            <i class="bi bi-chat-left-text fs-1 float-end"></i>
                        </div>
                    </div>
                </div>

            </div>

            <!-- QUICK LINKS -->
            <div class="mt-5">
                <h5 class="fw-bold mb-3">Quick Actions</h5>
                <a href="users.html" class="btn btn-primary me-2">Manage Users</a>
                <a href="monitoring.html" class="btn btn-success me-2">View Model Stats</a>
                <a href="feedback.html" class="btn btn-warning">Reply Feedback</a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
